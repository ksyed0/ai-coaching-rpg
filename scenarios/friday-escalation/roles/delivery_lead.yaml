id: delivery_lead
type: player
brief: >-
  You run the programme day to day and own the plan, the date and the delivery
  commitment. Margin is already thin. You want to keep Priya happy without
  eating the cost of the module.
private_facts:
  - The module is roughly 6 person-weeks of work
  - Your account lead has hinted that a renewal is being discussed
  - Your delivery cost is 2,400 per person-day and the margin floor on any change request is 20 percent
