services:
  runtime:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.runtime
    init: true
    # US-0018: the server exits non-zero when it can no longer write its session log safely (fail-stop); restart it so it resumes the
    # session from its log. At most 5 tries: a failure that repeats (a full disk) stops here instead of restarting forever.
    restart: on-failure:5
    # Secrets are passed at runtime from the git-ignored .env; they are never baked into the image.
    # run.sh creates .env from .env.example when it is missing.
    env_file: ../../.env
    environment:
      RUNTIME_PORT: "8080"
      # Inside the container the server must bind all interfaces (binding its loopback would break the published port).
      # Who can reach it is decided by the `ports` line below.
      RUNTIME_HOST: "0.0.0.0"
      SCENARIO_DIR: scenarios/friday-escalation
    # Lets the container reach a model server on the host (LOCAL_BASE_URL=http://host.docker.internal:11434/v1);
    # Docker Desktop and OrbStack provide this name already, the mapping makes it work on Linux too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Run as the invoking host user (run.sh exports HOST_UID/HOST_GID) so the bind-mounted
    # ./data is writable on Linux; the default 1000 matches the image's non-root `node` user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Intentionally published on ALL interfaces so teammates on the LAN can join. Set FACILITATOR_TOKEN in .env
    # (run.sh does it for a new .env): without it anyone who can reach the port is a facilitator. No TLS: see
    # docs/THREAT_MODEL.md. HOST_PORT changes the host-side port.
    # Behind a TLS reverse proxy on THIS machine, publish on loopback only and set TRUST_PROXY=1 in .env:
    #   ports: ["127.0.0.1:${HOST_PORT:-8080}:8080"]
    ports: ["${HOST_PORT:-8080}:8080"]
    volumes:
      - ../../data:/app/data
      - ../../scenarios:/app/scenarios:ro
